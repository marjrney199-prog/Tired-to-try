name: ea_language_hub
description: Plataforma linguística educativa, offline-first e gratuita.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path: ^1.9.0
  crypto: ^3.0.6
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.15.0
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon_512.png
  adaptive_icon_background: "#0A2342"
  adaptive_icon_foreground: assets/icons/app_icon_512.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/lessons/
    - assets/audio/
